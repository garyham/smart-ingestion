<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search chunks · Smart Files</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      main { width: min(56rem, calc(100% - 2rem)); margin: 3rem auto; }
      form { display: flex; gap: 0.75rem; }
      input, button { box-sizing: border-box; font: inherit; padding: 0.7rem; }
      input { flex: 1; min-width: 0; }
      #status { min-height: 1.5rem; }
      #results { display: grid; gap: 1rem; padding: 0; list-style: none; }
      article { padding: 1rem; border: 1px solid ButtonBorder; border-radius: 0.5rem; }
      article p { line-height: 1.5; white-space: pre-wrap; }
      .meta { color: GrayText; font-size: 0.85rem; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">← Upload</a></p>
      <h1>Search indexed chunks</h1>
      <form id="query-form">
        <input id="query" name="query" type="search" maxlength="2000"
               placeholder="What do you want to find?" required autofocus>
        <button type="submit">Search</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ol id="results"></ol>
    </main>

    <script>
      const form = document.querySelector("#query-form");
      const query = document.querySelector("#query");
      const button = form.querySelector("button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");

      function addResult(result, index) {
        const item = document.createElement("li");
        const article = document.createElement("article");
        const heading = document.createElement("h2");
        const content = document.createElement("p");
        const meta = document.createElement("div");
        heading.textContent = result.headings.length
          ? result.headings.join(" › ")
          : `Result ${index + 1}`;
        content.textContent = result.content;
        meta.className = "meta";
        meta.textContent = `Document ${result.document_id} · Chunk ${result.chunk_index}`;
        article.append(heading, content, meta);
        item.append(article);
        results.append(item);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        results.replaceChildren();
        status.textContent = "Searching…";
        try {
          const response = await fetch("/query", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({query: query.value, limit: 3}),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.detail || "Search failed");
          body.results.forEach(addResult);
          status.textContent = body.results.length
            ? `${body.results.length} chunks found.`
            : "No chunks found.";
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
