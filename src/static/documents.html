<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documents · Smart Files</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      main { width: min(56rem, calc(100% - 2rem)); margin: 3rem auto; }
      button { box-sizing: border-box; font: inherit; padding: 0.4rem 0.8rem; }
      #status { min-height: 1.5rem; }
      #documents { display: grid; gap: 0.75rem; padding: 0; list-style: none; }
      article {
        display: flex; gap: 1rem; align-items: center; justify-content: space-between;
        padding: 1rem; border: 1px solid ButtonBorder; border-radius: 0.5rem;
      }
      article div { min-width: 0; }
      h2 { margin: 0 0 0.25rem; font-size: 1rem; overflow-wrap: anywhere; }
      .meta { color: GrayText; font-size: 0.85rem; overflow-wrap: anywhere; }
      .state { font-size: 0.85rem; margin-top: 0.25rem; }
      .state[data-status="failed"], .state[data-status="needs_intervention"] {
        color: light-dark(#b42318, #f97066);
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">← Upload</a> · <a href="/query">Search indexed chunks</a></p>
      <h1>Documents</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <ul id="documents"></ul>
    </main>

    <script>
      const status = document.querySelector("#status");
      const list = document.querySelector("#documents");

      function formatSize(bytes) {
        const units = ["B", "KB", "MB", "GB"];
        let size = bytes;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) {
          size /= 1024;
          unit += 1;
        }
        return `${unit ? size.toFixed(1) : size} ${units[unit]}`;
      }

      const STATUS_LABELS = {
        uploaded: "Uploaded",
        ingesting: "Ingesting",
        embedding: "Embedding",
        ok: "Ingested",
        needs_intervention: "Needs intervention",
        failed: "Failed",
      };

      function describeState(doc) {
        const parts = [STATUS_LABELS[doc.status] || doc.status];
        if (doc.error && doc.error.detail) parts.push(doc.error.detail);
        parts.push(doc.published ? "searchable" : "not yet searchable");
        return parts.join(" · ");
      }

      function describeCount() {
        const count = list.children.length;
        status.textContent = count
          ? `${count} document${count === 1 ? "" : "s"}.`
          : "No documents yet.";
      }

      async function remove(doc, item, button) {
        const confirmed = confirm(
          `Delete ${doc.filename}? Its chunks, embeddings, and ingestion output go with it.`
        );
        if (!confirmed) return;
        button.disabled = true;
        status.textContent = `Deleting ${doc.filename}…`;
        try {
          const response = await fetch(`/documents/${doc.document_id}`, {method: "DELETE"});
          // Already gone is what we wanted.
          if (!response.ok && response.status !== 404) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || "Delete failed");
          }
          item.remove();
          describeCount();
        } catch (error) {
          status.textContent = error.message;
          button.disabled = false;
        }
      }

      function addDocument(doc) {
        const item = document.createElement("li");
        const article = document.createElement("article");
        const details = document.createElement("div");
        const heading = document.createElement("h2");
        const meta = document.createElement("div");
        const state = document.createElement("div");
        const button = document.createElement("button");
        heading.textContent = doc.filename;
        meta.className = "meta";
        meta.textContent = [
          doc.content_type,
          formatSize(doc.size),
          new Date(doc.created_at).toLocaleString(),
          doc.content_id.slice(0, 12),
        ].join(" · ");
        meta.title = doc.content_id;
        state.className = "state";
        state.dataset.status = doc.status;
        state.textContent = describeState(doc);
        button.type = "button";
        button.textContent = "Delete";
        button.addEventListener("click", () => remove(doc, item, button));
        details.append(heading, meta, state);
        article.append(details, button);
        item.append(article);
        list.append(item);
      }

      async function load() {
        try {
          const response = await fetch("/documents?limit=500");
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.detail || "Could not load documents");
          body.forEach(addDocument);
          describeCount();
        } catch (error) {
          status.textContent = error.message;
        }
      }

      load();
    </script>
  </body>
</html>
