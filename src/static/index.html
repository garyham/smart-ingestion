<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Files</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
      }

      form {
        display: grid;
        gap: 1rem;
      }

      button,
      input {
        font: inherit;
      }

      button {
        padding: 0.6rem 1rem;
      }

      #status {
        min-height: 1.5rem;
      }

      nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Upload a file</h1>
      <form id="upload-form">
        <input id="file" name="file" type="file" required>
        <button type="submit">Upload</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>

      <p><a href="/query">Search indexed chunks</a> · <a href="/library">Documents</a></p>

      <nav aria-labelledby="observability-heading">
        <h2 id="observability-heading">Observability</h2>
        <ul>
          <li><a href="http://127.0.0.1:4200" target="_blank" rel="noopener noreferrer">Prefect</a></li>
          <li><a href="http://127.0.0.1:9333" target="_blank" rel="noopener noreferrer">SeaweedFS master</a></li>
          <li><a href="http://127.0.0.1:8888" target="_blank" rel="noopener noreferrer">SeaweedFS filer</a></li>
        </ul>
      </nav>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const fileInput = document.querySelector("#file");
      const status = document.querySelector("#status");
      const button = form.querySelector("button");

      // WebCrypto has no incremental digest, so hashing holds the whole file in memory.
      // Past this size the check is skipped rather than paid for.
      const HASH_SIZE_LIMIT = 64 * 1024 * 1024;

      async function readJson(response) {
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.detail || `Request failed (${response.status})`);
        }
        return body;
      }

      async function sha256(file) {
        const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
        return Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }

      // A document is its bytes, so their hash is enough to ask whether this file has been
      // seen - and a file that has been costs one small request instead of an upload. The
      // check is only ever an optimisation: if it cannot run or fails, we upload as before
      // and the server hashes what arrives.
      async function findExistingDocument(file) {
        if (!window.crypto?.subtle || file.size > HASH_SIZE_LIMIT) return null;
        try {
          const contentId = await sha256(file);
          const response = await fetch(
            `/documents/lookup?sha256=${encodeURIComponent(contentId)}`,
          );
          if (!response.ok) return null;
          const body = await response.json();
          return body.known ? body : null;
        } catch {
          return null;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        const contentType = file.type || "application/octet-stream";
        const details = {
          filename: file.name,
          content_type: contentType,
          size: file.size,
        };

        button.disabled = true;
        status.textContent = "Checking whether this file is already known…";

        try {
          const existing = await findExistingDocument(file);
          if (existing) {
            form.reset();
            status.textContent =
              `Already ingested as document ${existing.document_id}. Nothing was uploaded.`;
            return;
          }

          status.textContent = "Creating upload URL…";
          const presignResponse = await fetch("/presign", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(details),
          });
          const presign = await readJson(presignResponse);

          status.textContent = "Uploading…";
          // The headers are part of the signature: they make this a single write of
          // exactly the declared size, so the bytes cannot change once they are hashed.
          const uploadResponse = await fetch(presign.upload_url, {
            method: "PUT",
            headers: presign.upload_headers,
            body: file,
          });
          if (!uploadResponse.ok) {
            throw new Error(`Upload failed (${uploadResponse.status})`);
          }

          status.textContent = "Sending notification…";
          const notifyResponse = await fetch("/notify", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({document_id: presign.document_id}),
          });
          const notification = await readJson(notifyResponse);

          form.reset();
          status.textContent = `Upload queued as Prefect task ${notification.task_run_id}.`;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
