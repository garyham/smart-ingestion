services:
  prefect-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PREFECT_POSTGRES_DB:-prefect}
      POSTGRES_USER: ${PREFECT_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-prefect}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  smart-files-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${SMART_FILES_POSTGRES_DB:-smart_files}
      POSTGRES_USER: ${SMART_FILES_POSTGRES_USER:-smart_files}
      POSTGRES_PASSWORD: ${SMART_FILES_POSTGRES_PASSWORD:-smart_files}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - smart_files_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prefect:
    build: .
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_POSTGRES_USER:-prefect}:${PREFECT_POSTGRES_PASSWORD:-prefect}@prefect-postgres:5432/${PREFECT_POSTGRES_DB:-prefect}
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      prefect-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  smartfiles-init:
    build: .
    command: ["smart-files-init"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      DATABASE_URL: postgresql://${SMART_FILES_POSTGRES_USER:-smart_files}:${SMART_FILES_POSTGRES_PASSWORD:-smart_files}@smart-files-postgres:5432/${SMART_FILES_POSTGRES_DB:-smart_files}
    depends_on:
      prefect:
        condition: service_healthy
      smart-files-postgres:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -s3.allowedOrigins=${WEB_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://0.0.0.0:8000}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  tika:
    image: apache/tika:4.0.0
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_RESULTS_LOCAL_STORAGE_PATH: /task-results
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      DATABASE_URL: postgresql://${SMART_FILES_POSTGRES_USER:-smart_files}:${SMART_FILES_POSTGRES_PASSWORD:-smart_files}@smart-files-postgres:5432/${SMART_FILES_POSTGRES_DB:-smart_files}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-1}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - prefect_results:/task-results
    depends_on:
      prefect:
        condition: service_healthy
      smartfiles-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ingest:
    build: .
    command: ["ingest-worker"]
    deploy:
      replicas: 4
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: sync+restart
          path: ./config
          target: /app/config
          initial_sync: true
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_RESULTS_LOCAL_STORAGE_PATH: /task-results
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      DATABASE_URL: postgresql://${SMART_FILES_POSTGRES_USER:-smart_files}:${SMART_FILES_POSTGRES_PASSWORD:-smart_files}@smart-files-postgres:5432/${SMART_FILES_POSTGRES_DB:-smart_files}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-1}
      ARTIFACT_PREFIX: ${ARTIFACT_PREFIX:-ingested}
      TIKA_URL: http://tika:9998
      TIKA_TIMEOUT_SECONDS: ${TIKA_TIMEOUT_SECONDS:-120}
    depends_on:
      prefect:
        condition: service_healthy
      smartfiles-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      tika:
        condition: service_healthy
    volumes:
      - prefect_results:/task-results
    restart: unless-stopped

  embed:
    build: .
    command: ["embed-worker"]
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_RESULTS_LOCAL_STORAGE_PATH: /task-results
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      DATABASE_URL: postgresql://${SMART_FILES_POSTGRES_USER:-smart_files}:${SMART_FILES_POSTGRES_PASSWORD:-smart_files}@smart-files-postgres:5432/${SMART_FILES_POSTGRES_DB:-smart_files}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-1}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
    depends_on:
      prefect:
        condition: service_healthy
      smartfiles-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    volumes:
      - prefect_results:/task-results
    restart: unless-stopped

  sweep:
    build: .
    command: ["upload-sweeper"]
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      DATABASE_URL: postgresql://${SMART_FILES_POSTGRES_USER:-smart_files}:${SMART_FILES_POSTGRES_PASSWORD:-smart_files}@smart-files-postgres:5432/${SMART_FILES_POSTGRES_DB:-smart_files}
    depends_on:
      prefect:
        condition: service_healthy
      smartfiles-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect_postgres_data:
  smart_files_postgres_data:
  prefect_results:
  seaweedfs_data:
