services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prefect}
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prefect:
    build: .
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-prefect}:${POSTGRES_PASSWORD:-prefect}@postgres:5432/${POSTGRES_DB:-prefect}
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -s3.allowedOrigins=http://localhost:8000,http://127.0.0.1:8000
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smart_files}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-smart_files}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./src/static:/app/src/static:ro
    environment:
      S3_ENDPOINT_URL: http://127.0.0.1:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-smart_files}:${RABBITMQ_DEFAULT_PASS:-smart_files}@rabbitmq:5672/%2F
      UPLOAD_EXCHANGE: ${UPLOAD_EXCHANGE:-file-uploads}
      INGEST_QUEUE: ${INGEST_QUEUE:-file-ingestion}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seaweedfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ingest:
    build: .
    command: ["ingest"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_files}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_files_secret}
      S3_BUCKET: ${S3_BUCKET:-smart-files}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-smart_files}:${RABBITMQ_DEFAULT_PASS:-smart_files}@rabbitmq:5672/%2F
      UPLOAD_EXCHANGE: ${UPLOAD_EXCHANGE:-file-uploads}
      INGEST_QUEUE: ${INGEST_QUEUE:-file-ingestion}
      COMPLETION_EXCHANGE: ${COMPLETION_EXCHANGE:-ingestion-results}
      PROCESS_QUEUE: ${PROCESS_QUEUE:-file-processing}
      ARTIFACT_PREFIX: ${ARTIFACT_PREFIX:-ingested}
    depends_on:
      prefect:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
  rabbitmq_data:
