[project]
name = "smart-files"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "duckdb>=1.5.5",
    "fastapi>=0.115.0",
    "filetype>=1.2.0",
    "langchain-text-splitters>=0.3.0",
    "markitdown[docx]>=0.1.1",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "uvicorn>=0.32.0",
]

[project.scripts]
observability-api = "observability_api:main"
ask = "llm_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = [
    "src/celery_app.py",
    "src/tasks.py",
    "src/observability_api.py",
    "src/queue_db.py",
    "src/queue_uri.py",
    "src/llm_test.py",
    "src/ingestion",
]

[dependency-groups]
dev = [
    "litellm>=1.94.0",
]
