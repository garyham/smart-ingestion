[project]
name = "smart-files"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.93",
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.140.13",
    "filetype>=1.2.0",
    "langchain-text-splitters>=0.3.0",
    "litellm>=1.94.0",
    "markitdown[docx]>=0.1.1",
    "prefect>=3.8.0",
    "psycopg[binary]>=3.2.10",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
ingest = "poll_ingest:main"
clean-runs = "clean_runs:main"
load-test = "load_test:main"
ask = "llm_test:main"
api = "api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/api.py", "src/static", "src/upload_events.py", "src/postgres_queue.py", "src/poll_ingest.py", "src/clean_runs.py", "src/load_test.py", "src/llm_test.py", "src/ingestion"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
