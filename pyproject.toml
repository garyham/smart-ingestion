[project]
name = "smart-files"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.93",
    "duckdb>=1.5.5",
    "fastembed>=0.7.4",
    "fastapi[standard]>=0.140.13",
    "httpx>=0.28.1",
    "langchain-text-splitters>=0.3.0",
    "litellm>=1.94.0",
    "prefect>=3.8.0",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.13.4",
]

[project.scripts]
ingest-worker = "background_tasks:ingest_worker"
embed-worker = "background_tasks:embedding_worker"
clean-runs = "clean_runs:main"
load-test = "load_test:main"
ask = "llm_test:main"
api = "api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/api.py", "src/static", "src/upload_events.py", "src/background_tasks.py", "src/clean_runs.py", "src/load_test.py", "src/llm_test.py", "src/ingestion", "src/embeddings"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
