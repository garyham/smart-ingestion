[project]
name = "smart-files"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "filetype>=1.2.0",
    "langchain-text-splitters>=0.3.0",
    "markitdown[docx]>=0.1.1",
    "prefect>=3.8.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
live = "pipeline:main"
clean-runs = "clean_runs:main"
ask = "llm_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/pipeline.py", "src/clean_runs.py", "src/llm_test.py", "src/ingestion"]

[dependency-groups]
dev = [
    "litellm>=1.94.0",
]
